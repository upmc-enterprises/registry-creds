apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-creds
spec:
  template:
    spec:
      serviceAccountName: registry-creds
      containers:
      - image: ghcr.io/manifest-cyber/registry-creds
        name: registry-creds
        imagePullPolicy: IfNotPresent
        envFrom:
          - secretRef:
              name: registry-creds-dpr
              optional: true
          - secretRef:
              name: registry-creds-ecr
              optional: true
          - secretRef:
              name: registry-creds-gcr
              optional: true
          - secretRef:
              name: registry-creds-acr
              optional: true
        volumeMounts:
        - name: gcr-creds
          mountPath: "/root/.config/gcloud"
          readOnly: true
      volumes:
      - name: gcr-creds
        secret:
          secretName: registry-creds-gcr
          optional: true
